# Hexo Configuration
# Docs: https://hexo.io/docs/configuration.html

# ---------------------------------------------------------------
# Site
# ---------------------------------------------------------------

title: Yici's Blog
subtitle: ''
description: 'Distributed Systems / Raft / Paxos / Database / Backend'
keywords:
  - Distributed Systems
  - Raft
  - Paxos
  - Java
  - Backend
author: Yici Zhang
language: zh-CN
timezone: Asia/Shanghai

# ---------------------------------------------------------------
# URL
# ---------------------------------------------------------------

url: https://yicizhang00.github.io
root: /
permalink: posts/:title/
permalink_defaults:

pretty_urls:
  trailing_index: false
  trailing_html: false

# ---------------------------------------------------------------
# Directory
# ---------------------------------------------------------------

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# ---------------------------------------------------------------
# Writing
# ---------------------------------------------------------------

new_post_name: :title.md
default_layout: post
titlecase: false
filename_case: 0

external_link:
  enable: true
  field: site
  exclude: ''

render_drafts: false
post_asset_folder: true
relative_link: false
future: true

# ---------------------------------------------------------------
# Syntax Highlight
# ---------------------------------------------------------------

syntax_highlighter: prismjs

highlight:
  enable: false

prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# ---------------------------------------------------------------
# Home Page
# ---------------------------------------------------------------

index_generator:
  path: ''
  per_page: 10
  order_by: -date

# ---------------------------------------------------------------
# Category & Tag
# ---------------------------------------------------------------

default_category: uncategorized

category_map:
tag_map:

# ---------------------------------------------------------------
# Metadata
# ---------------------------------------------------------------

meta_generator: true

# ---------------------------------------------------------------
# Date / Time format
# ---------------------------------------------------------------

date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# ---------------------------------------------------------------
# Pagination
# ---------------------------------------------------------------

per_page: 10
pagination_dir: page

# ---------------------------------------------------------------
# Include / Exclude
# ---------------------------------------------------------------

include:
exclude:
ignore:

# ---------------------------------------------------------------
# Theme
# ---------------------------------------------------------------

theme: fluid

# ---------------------------------------------------------------
# Deployment
# ---------------------------------------------------------------

deploy:
  type: git
  repository: git@github.com:yicizhang00/yicizhang00.github.io.git
  branch: main

# ---------------------------------------------------------------
# RSS Feed
# ---------------------------------------------------------------

feed:
  type: atom
  path: atom.xml
  limit: 20

# ---------------------------------------------------------------
# Sitemap
# ---------------------------------------------------------------

sitemap:
  path: sitemap.xml

# ---------------------------------------------------------------
# Markdown Renderer
# ---------------------------------------------------------------

markdown:
  render:
    html: true
    xhtmlOut: false
    breaks: true
    linkify: true
    typographer: true

# ---------------------------------------------------------------
# Search
# ---------------------------------------------------------------

search:
  path: search.xml
  field: post
  content: true

# ---------------------------------------------------------------
# Math
# ---------------------------------------------------------------

math:
  engine: katex

# ---------------------------------------------------------------
# Extensions
# ---------------------------------------------------------------

# RSS
plugins:
  - hexo-generator-feed
  - hexo-generator-sitemap
  - hexo-generator-search