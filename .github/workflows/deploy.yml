```yaml
name: Blog CI/CD

on:
  push:
    branches:
      - source

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  blog-cicd:
    name: Hexo Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: |
          npm install -g hexo-cli
          npm ci

      - name: Verify Markdown Renderer
        run: |
          npm ls hexo-renderer-markdown-it markdown-it-obsidian-callouts

      - name: Generate Static Files
        run: |
          hexo clean
          hexo generate

      - name: Verify Callout Output
        run: |
          if grep -R -q 'data-callout="warning"' public; then
            echo "WARNING Callout HTML generated successfully."
          else
            echo "WARNING Callout HTML not found. Check the Markdown renderer and plugin configuration."
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: main
          force_orphan: true
          cname: www.yiciblog.xyz
          user_name: yicizhang00
          user_email: zhangyici2000@outlook.com
          commit_message: "deploy: site updated"
```
